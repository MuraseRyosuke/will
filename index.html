<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Will & Digital Declaration - Ryosuke Murase</title>
  <style>
    :root {
      --bg: #0d1117;
      --text: #e6edf3;
      --accent: #58a6ff;
      --border: #30363d;
      --box-bg: #161b22;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --text: #24292f;
        --accent: #0969da;
        --border: #d0d7de;
        --box-bg: #f6f8fa;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      max-width: 820px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    h1 {
      font-size: 1.4rem;
      margin: 0 0 8px 0;
      font-weight: 600;
    }
    .links {
      font-size: 0.9rem;
      margin-top: 8px;
    }
    .links a {
      color: var(--accent);
      text-decoration: none;
      margin-right: 16px;
    }
    .links a:hover {
      text-decoration: underline;
    }
    pre {
      background-color: var(--box-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.88rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }
    footer {
      margin-top: 32px;
      font-size: 0.85rem;
      color: #8b949e;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Public Will & Digital Declaration</h1>
    <div class="links">
      <a href="index.txt">📄 Raw Signed Text (index.txt)</a>
      <a href="gpgkey.txt">🔑 GPG Public Key (gpgkey.txt)</a>
      <a href="https://muraseryosuke.info">🌐 muraseryosuke.info</a>
    </div>
  </header>

  <main>
    <pre id="will-content">Loading signed declaration...</pre>
  </main>

  <footer>
    &copy; 2026 Ryosuke Murase. Verified by OpenPGP / Ed25519.
  </footer>

  <script>
    fetch('index.txt')
      .then(response => response.text())
      .then(text => {
        document.getElementById('will-content').textContent = text;
      })
      .catch(err => {
        document.getElementById('will-content').textContent = 'Failed to load declaration text.';
      });
  </script>
</body>
</html>
